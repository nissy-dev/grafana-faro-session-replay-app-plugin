services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100

  tempo:
    image: grafana/tempo:2.9.1
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - 3200:3200
    volumes:
      - ./examples/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
      - tempo
    ports:
      - 12347:12347
    volumes:
      - ./examples/alloy/config.alloy:/etc/alloy/config.alloy:ro

  demo-app:
    build:
      context: ./examples/demo-app
    depends_on:
      - alloy
    ports:
      - 4173:4173
