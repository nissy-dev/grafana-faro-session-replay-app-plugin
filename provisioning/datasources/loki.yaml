apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: local-loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: traceID
          url: '${__value.raw}'
          datasourceUid: local-tempo
